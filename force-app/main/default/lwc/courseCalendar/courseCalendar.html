<template>
    <div class="calendar-container">
        <div class="calendar-header">
            <div class="time-axis-spacer"></div>
            <template for:each={calendarDays} for:item="day">
                <div key={day.key} class="day-header">{day.label}</div>
            </template>
        </div>
        <div class="calendar-body">
            <div class="time-axis">
                <template for:each={timeAxisLabels} for:item="tick">
                    <span key={tick.key} class="time-tick" style={tick.style}>{tick.label}</span>
                </template>
            </div>
            <template for:each={calendarDays} for:item="day">
                <div key={day.key} class="day-column">
                    <template for:each={timeAxisLabels} for:item="tick">
                        <div key={tick.key} class="hour-line" style={tick.style}></div>
                    </template>
                    <template for:each={day.slots} for:item="slot">
                        <div key={slot.key} class="slot-card" style={slot.style}>
                            <p class="slot-course">{slot.courseName}</p>
                            <p class="slot-instructor">{slot.instructor}</p>
                            <p class="slot-time">{slot.timeLabel}</p>
                        </div>
                    </template>
                </div>
            </template>
        </div>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading schedule"></lightning-spinner>
        </template>
        <template if:true={hasError}>
            <p class="error-message">Failed to load schedule. Please refresh.</p>
        </template>
    </div>
</template>
