<template>
  <lightning-card title={title} icon-name="standard:event">
    <div class="slds-var-p-horizontal_medium slds-var-p-bottom_small">
      <template lwc:if={error}>
        <p class="slds-text-color_error" data-id="error-message">
          {errorMessage}
        </p>
      </template>
      <template lwc:elseif={isEmpty}>
        <p data-id="empty-message">{emptyMessage}</p>
      </template>
      <template lwc:else>
        <table
          class="slds-table slds-table_bordered slds-table_cell-buffer"
          data-id="time-slots-table"
        >
          <thead>
            <tr class="slds-line-height_reset">
              <th scope="col">{dayColumnHeader}</th>
              <th scope="col">{startColumnHeader}</th>
              <th scope="col">{endColumnHeader}</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={slots} for:item="slot">
              <tr key={slot.id} data-id="time-slot-row">
                <td>{slot.day}</td>
                <td>{slot.startLabel}</td>
                <td>{slot.endLabel}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>
    </div>
  </lightning-card>
</template>
