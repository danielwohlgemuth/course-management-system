<template>
  <lightning-card title={title} icon-name="standard:event">
    <div class="slds-var-p-horizontal_medium slds-var-p-bottom_small">
      <template lwc:if={isDraft}>
        <template lwc:if={hasWindows}>
          <table
            class="slds-table slds-table_bordered slds-table_cell-buffer slds-var-m-bottom_small"
            data-id="availability-table"
          >
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">{dayColumnHeader}</th>
                <th scope="col">{startColumnHeader}</th>
                <th scope="col">{endColumnHeader}</th>
                <th scope="col"></th>
              </tr>
            </thead>
            <tbody>
              <template for:each={windows} for:item="window">
                <tr
                  key={window.id}
                  data-id="window-row"
                  data-row-id={window.id}
                >
                  <template lwc:if={window.isEditing}>
                    <td colspan="4">
                      <lightning-record-edit-form
                        record-id={window.id}
                        object-api-name="Availability__c"
                        onsuccess={handleSuccess}
                        onerror={handleError}
                      >
                        <lightning-messages></lightning-messages>
                        <div
                          class="slds-grid slds-gutters slds-grid_vertical-align-end"
                        >
                          <div class="slds-col">
                            <lightning-input-field
                              field-name="Day_of_Week__c"
                            ></lightning-input-field>
                          </div>
                          <div class="slds-col">
                            <lightning-input-field
                              field-name="Start_Time__c"
                            ></lightning-input-field>
                          </div>
                          <div class="slds-col">
                            <lightning-input-field
                              field-name="End_Time__c"
                            ></lightning-input-field>
                          </div>
                          <div class="slds-col slds-no-flex">
                            <lightning-button
                              type="submit"
                              variant="brand"
                              label={saveButtonLabel}
                              class="slds-var-m-right_x-small"
                            ></lightning-button>
                            <lightning-button
                              label={cancelButtonLabel}
                              onclick={handleCancel}
                            ></lightning-button>
                          </div>
                        </div>
                      </lightning-record-edit-form>
                    </td>
                  </template>
                  <template lwc:else>
                    <td>{window.day}</td>
                    <td>{window.startLabel}</td>
                    <td>{window.endLabel}</td>
                    <td>
                      <lightning-button
                        label={editButtonLabel}
                        data-id={window.id}
                        onclick={handleEditClick}
                        class="slds-var-m-right_x-small"
                      ></lightning-button>
                      <lightning-button
                        variant="destructive-text"
                        label={deleteButtonLabel}
                        data-id={window.id}
                        onclick={handleDelete}
                      ></lightning-button>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </template>
        <template lwc:else>
          <p class="slds-var-m-bottom_small">{emptyMessage}</p>
        </template>

        <template lwc:if={showAddForm}>
          <lightning-record-edit-form
            object-api-name="Availability__c"
            onsuccess={handleSuccess}
            onerror={handleError}
          >
            <lightning-messages></lightning-messages>
            <lightning-input-field
              field-name="Course_Plan__c"
              value={recordId}
              class="slds-hide"
            ></lightning-input-field>
            <div class="slds-grid slds-gutters slds-grid_vertical-align-end">
              <div class="slds-col">
                <lightning-input-field
                  field-name="Day_of_Week__c"
                ></lightning-input-field>
              </div>
              <div class="slds-col">
                <lightning-input-field
                  field-name="Start_Time__c"
                ></lightning-input-field>
              </div>
              <div class="slds-col">
                <lightning-input-field
                  field-name="End_Time__c"
                ></lightning-input-field>
              </div>
              <div class="slds-col slds-no-flex">
                <lightning-button
                  type="submit"
                  variant="brand"
                  label={saveButtonLabel}
                  class="slds-var-m-right_x-small"
                ></lightning-button>
                <lightning-button
                  label={cancelButtonLabel}
                  onclick={handleCancel}
                ></lightning-button>
              </div>
            </div>
          </lightning-record-edit-form>
        </template>
        <template lwc:elseif={isAddingOrEditing}></template>
        <template lwc:else>
          <lightning-button
            label={addButtonLabel}
            onclick={handleAddClick}
          ></lightning-button>
        </template>
      </template>

      <template lwc:else>
        <p class="slds-var-m-bottom_small">{lockedHelpText}</p>
        <template lwc:if={hasWindows}>
          <table
            class="slds-table slds-table_bordered slds-table_cell-buffer"
            data-id="availability-table"
          >
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">{dayColumnHeader}</th>
                <th scope="col">{startColumnHeader}</th>
                <th scope="col">{endColumnHeader}</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={windows} for:item="window">
                <tr key={window.id}>
                  <td>{window.day}</td>
                  <td>{window.startLabel}</td>
                  <td>{window.endLabel}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>
      </template>

      <template lwc:if={actionError}>
        <p
          class="slds-text-color_error slds-var-m-top_small"
          data-id="action-error"
        >
          {actionError}
        </p>
      </template>
    </div>
  </lightning-card>
</template>
